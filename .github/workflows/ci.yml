name: CI

# Regression checks for every bug this site has had. Runs on every push and
# pull request; Cloudflare Pages deploys main regardless, so keep this green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Necessary: runs on every push and pull request.
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files, asset hashes, SEO, links, privacy, licences
        run: python tools/ci/check_static.py

  # Decides the conditional jobs from the changed files (rules in tools/ci/changes.py).
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Manual runs, new branches and diffs GitHub cannot list (force pushes, 300+ files) run everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename') \
             || [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"; echo "running everything"; exit 0
          fi
          printf '%s\n' "$files" | python3 tools/ci/changes.py - >> "$GITHUB_OUTPUT"

  # Conditional: only when a change can affect what the browser loads.
  browser:
    name: Browser tests ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # Pinned: Playwright 1.58 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt

      - name: Install Python packages (locked, hash-checked)
        run: pip install --require-hashes -r tools/ci/requirements.txt

      # The browser build follows the Playwright version, which the lockfile pins.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/ci/requirements.txt') }}

      # No --with-deps: the runner image ships Chrome and its system libraries, and
      # the apt step took up to 6 minutes on slow mirrors. Fall back to it only if
      # the headless shell cannot start.
      - name: Install Chromium headless shell
        run: |
          python -m playwright install --only-shell chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()" \
            || python -m playwright install-deps chromium

      - name: Browser tests (desktop and phone)
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/ci/test_site.py --shard ${{ matrix.shard }}/3
